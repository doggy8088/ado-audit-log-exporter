name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且包含完整原生執行檔的 GitHub Release 標籤
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm to latest
        run: npm install -g npm@latest
      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ -z "$VERSION" || "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag must use the v<version> format"
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" != "$VERSION" ||
                "$LOCK_VERSION" != "$VERSION" ||
                "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::Version mismatch: tag=$VERSION package=$PACKAGE_VERSION lock=$LOCK_VERSION cargo=$CARGO_VERSION"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Publish
        run: npm publish --access public
        env:
          ADO_AUDIT_LOG_EXPORTER_RELEASE_ASSET_RETRIES: 12
          ADO_AUDIT_LOG_EXPORTER_RELEASE_ASSET_RETRY_DELAY_MS: 10000
