[package]
name = "ado-audit-log-exporter"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["Will Huang"]
description = "Export Azure DevOps audit logs through the REST API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/doggy8088/ado-audit-log-exporter"
homepage = "https://github.com/doggy8088/ado-audit-log-exporter"
documentation = "https://docs.rs/ado-audit-log-exporter"
keywords = ["azure-devops", "audit", "cli", "security"]
categories = ["api-bindings", "command-line-utilities"]
include = [
    "/src/**",
    "/tests/client_integration.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "ado_audit_log_exporter"
path = "src/lib.rs"

[[bin]]
name = "ado-audit-log-exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
